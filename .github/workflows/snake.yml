name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Subtle Pink Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: chinmayeemhatre
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23A17D96&color_dots=%23161B22,%2329232D,%23493746,%2370546B,%23A17D96

      - name: Deploy Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
