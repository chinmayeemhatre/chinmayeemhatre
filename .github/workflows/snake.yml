name: Generate Hollow Contribution Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: chinmayeemhatre
          outputs: dist/snake.svg

      - name: Make Boxes Hollow
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          path = "dist/snake.svg"
          tree = ET.parse(path)
          root = tree.getroot()

          for rect in root.iter():
              if rect.tag.endswith("rect"):
                  rect.set("fill", "none")
                  rect.set("stroke", "#A17D96")
                  rect.set("stroke-width", "1")

          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY

      - name: Deploy
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
